databaseChangeLog:
  - changeSet:
      id: init-schema-1
      author: saphka
      changes:
        - createTable:
            tableName: shortlink
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: short_key
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: full_url
                  type: text
                  constraints:
                    nullable: false
