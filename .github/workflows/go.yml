name: Go
on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Unit Tests
        run: go test ./...
      - name: Integration Tests
        run: go -tags=integration ./integration
